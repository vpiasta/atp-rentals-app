<h5>Vencidos</h5>
<br>
<p>Hospedajes que siguen marcados como miembros en el sistema, pero cuya membresía ya pasó su fecha de vencimiento (probablemente porque no han renovado todavía).</p>
<p>Vale la pena revisarlos periódicamente para decidir si contactarlos para renovar, o cambiar su estado.</p>
