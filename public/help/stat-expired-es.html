<h3><strong style="color: rgb(102, 163, 224);">Vencidos</strong></h3><p><br></p><p>Hospedajes que siguen marcados como miembros en el sistema, pero cuya membresía ya pasó su fecha de vencimiento (probablemente porque no han renovado todavía).</p><p><br></p><p>Vale la pena revisarlos periódicamente para decidir si contactarlos para renovar, o cambiar su estado.</p>
