name: Auto-Heal Site

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-and-heal:
    runs-on: ubuntu-latest
    steps:
      - name: Check site health
        id: health
        run: |
          if curl -sf --connect-timeout 15 --max-time 30 https://trustedpanamastays.com/health > /dev/null; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repo
        if: steps.health.outputs.ok == 'false'
        uses: actions/checkout@v4

      - name: Force a redeploy by pushing an empty commit
        if: steps.health.outputs.ok == 'false'
        run: |
          git config user.name "TPS Auto-Heal"
          git config user.email "actions@users.noreply.github.com"
          git commit --allow-empty -m "chore: auto-heal redeploy (health check failed $(date -u +%Y-%m-%dT%H:%M:%SZ))"
          git push origin HEAD:main
